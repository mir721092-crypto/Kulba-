function confirmSale(){
 if(!cart.length){toast('Сабад холӣ аст','err');return}
 const raw=sum(cart,c=>c.qty*c.price),itv=$('sit').value;let tot=raw;
 if(itv!==''){const t=num(itv);if(!(t>=0)){toast('Итогро дуруст ворид кунед','err');return}tot=t}
 const m=$('spm').value,name=$('sc').value.trim(),ph=$('sph').value.trim();
 const paid=m==='cash'?tot:m==='debt'?0:Math.min(Math.max(num($('sca').value)||0,0),tot);
 const dbt=Math.round((tot-paid)*100)/100;
 if(dbt>0&&!name){toast('Барои қарз номи мизоҷро ворид кунед','err');return}
 for(const c of cart){const x=DB.inventory.find(i=>i.id===c.inv);if(!x||sum(cart.filter(z=>z.inv===c.inv),z=>z.qty)>x.qty){toast('Дар анбор барои «'+c.name+'» кофӣ нест','err');return}}
 const tq=sum(cart,c=>c.qty),ord=uid(),now=new Date().toISOString();
 cart.forEach((c,i)=>{const x=DB.inventory.find(z=>z.id===c.inv);x.qty=Math.round((x.qty-c.qty)*1000)/1000;
  DB.sales.push({id:uid(),order:ord,date:now,client:name,phone:ph,inv:c.inv,name:c.name,unit:c.unit,qty:c.qty,price:raw>0?c.price*tot/raw:tot/tq,cost:c.cost,lp:c.price,by:ROLE,dbt:i===0?dbt:0,br:(name&&vipOf(name)||{}).rate||0})});
 if(dbt>0){let d=DB.debts.find(x=>x.amount>0&&x.name.toLowerCase()===name.toLowerCase());
  if(d){d.amount=r2(d.amount+dbt);if(ph&&!d.phone)d.phone=ph;d.hist.push({d:now,a:dbt,t:'+'})}else DB.debts.push({id:uid(),name,phone:ph,amount:dbt,date:now,hist:[{d:now,a:dbt,t:'+'}]})}
 closeM();save();renderAll();toast('✅ Фурӯш сабт шуд: '+fmt(tot)+' TJS');

function delSale(o){
 const L=DB.sales.filter(s=>s.order===o);if(!L.length)return;const dbt=sum(L,s=>s.dbt||0);

 L.forEach(s=>{const x=DB.inventory.find(i=>i.id===s.inv)||DB.inventory.find(i=>i.name===s.name);if(x)x.qty=Math.round((x.qty+s.qty)*1000)/1000});
 if(dbt>0){const d=DB.debts.find(x=>x.amount>0&&x.name.toLowerCase()===(L[0].client||'').trim().toLowerCase());if(d){const a=Math.min(d.amount,dbt);d.amount-=a;d.hist.push({d:new Date().toISOString(),a,t:'x'})}}

 const te=sum(DB.expenses.filter(e=>ymd(e.date)===t),e=>e.amount),me=sum(DB.expenses.filter(e=>ymd(e.date).slice(0,7)===m),e=>e.amount);

function calc(){cmode='w';showM('<h3>📐 Ҳисобкунак</h3><div style="display:flex;gap:8px"><button class="b g" id="cmw" style="margin:0" onclick="cmode=\'w\';calcU()">🧱 Девор</button><button class="b g" id="cmf" style="margin:0" onclick="cmode=\'f\';calcU()">🪵 Пол / шифт</button></div><label>Дарозии хона (м)</label><input id="cl1" type="text" inputmode="decimal" placeholder="4" oninput="calcR()"><label>Бари хона (м)</label><input id="cl2" type="text" inputmode="decimal" placeholder="5" oninput="calcR()"><div id="chw"><label>Баландии девор (м)</label><input id="cl5" type="text" inputmode="decimal" placeholder="2.5" oninput="calcR()"></div><label>Дару тиреза — кам кардан (м²), ихтиёрӣ</label><input id="cl6" type="text" inputmode="decimal" oninput="calcR()"><label>Бари як дона (см)</label><input id="cl3" type="text" inputmode="decimal" placeholder="9" oninput="calcR()"><label>Дарозии як дона (м)</label><input id="cl7" type="text" inputmode="decimal" placeholder="2.5" oninput="calcR()"><label>Изофа (%)</label><input id="cl4" type="text" inputmode="decimal" value="0" oninput="calcR()"><div id="cr" class="cd" style="margin-top:10px"></div><button class="b g" onclick="closeM()">Пӯшидан</button>');calcU()}
function calcU(){$('chw').style.display=cmode==='w'?'':'none';$('cmw').textContent=(cmode==='w'?'● ':'')+'🧱 Девор';$('cmf').textContent=(cmode==='f'?'● ':'')+'🪵 Пол / шифт';calcR()}
function calcR(){const g=i=>num($(i).value)||0,L=g('cl1'),W=g('cl2'),H=g('cl5'),sub=g('cl6'),bw=g('cl3')/100,bl=g('cl7'),w=g('cl4'),per=2*(L+W),raw=cmode==='w'?per*H:L*W,area=Math.max(raw-sub,0),pc=bw*bl,pcs=pc>0?Math.ceil(area*(1+w/100)/pc-1e-9):0,r=x=>Math.round(x*100)/100;
 $('cr').innerHTML=(cmode==='w'?'<div class="r"><i>Давр (4 девор: бар+бар+дароз+дароз)</i><b>'+r(per)+' м</b></div>':'')+'<div class="r"><i>Масоҳат</i><b>'+r(area)+' м²</b></div><div class="r"><i>Масоҳати як дона</i><b>'+(pc>0?r(pc)+' м²':'—')+'</b></div><div class="r"><i>Чанд дона лозим</i><b style="font-size:18px;color:#667eea">'+(pc>0?pcs+' дона':'—')+'</b></div>'}
function csv(name,rows){const t='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download=name+'-'+ymd(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove()}
function csvSales(){csv('furush',[['Сана','Мизоҷ','Телефон','Мол','Миқдор','Воҳид','Нарх','Ҷамъ','Фоида']].concat(DB.sales.map(s=>[formatD(s.date),s.client,s.phone,s.name,s.qty,s.unit,Math.round(s.price*100)/100,Math.round(s.qty*s.price*100)/100,Math.round(s.qty*(s.price-s.cost)*100)/100])))}
function csvInv(){csv('anbor',[['Мол','Воҳид','Миқдор','Нархи харид','Нархи фурӯш','Арзиш']].concat(DB.inventory.map(x=>[x.name,x.unit,x.qty,x.cost,x.price,Math.round(x.qty*x.cost)])))}

function moreDebt(id){const d=DB.debts.find(x=>x.id===id);if(!d)return;
 form('➕ Қарз илова: '+esc(d.name),[{k:'a',l:'Қарзи ҳозира: '+fmt(d.amount)+' TJS. Чанд илова мекунед?',t:'number'},{k:'n',l:'Шарҳ (ихтиёрӣ)'}],o=>{if(!(o.a>0))return'Суммаро ворид кунед';d.amount=Math.round((d.amount+o.a)*100)/100;d.hist.push({d:new Date().toISOString(),a:o.a,t:'+',n:o.n})})}
function addDebtFor(e){const k=decodeURIComponent(e),c=clients().find(x=>x.k===k);if(!c)return;
 form('➕ Қарз: '+esc(c.name),[{k:'a',l:'Сумма (TJS) *',t:'number'},{k:'n',l:'Шарҳ (ихтиёрӣ)'}],o=>{if(!(o.a>0))return'Суммаро ворид кунед';const now=new Date().toISOString();const d=DB.debts.find(x=>x.amount>0&&x.name.toLowerCase()===k);
  if(d){d.amount=Math.round((d.amount+o.a)*100)/100;d.hist.push({d:now,a:o.a,t:'+',n:o.n})}else DB.debts.push({id:uid(),name:c.name,phone:c.phone,amount:o.a,date:now,hist:[{d:now,a:o.a,t:'+',n:o.n}]})})}
function payDebtFor(e){const k=decodeURIComponent(e),d=DB.debts.find(x=>x.amount>0&&x.name.toLowerCase()===k);if(d)payDebt(d.id)}
function renderAll(){if(ROLE==='seller'){rSales();rBon();return}rDash();rSales();rInv();rSup();rDebts();rExp()}
/* ===== БОНУС: РЎЙХАТИ ФУРЎШАНДА, ДОДАН ===== */
function rBon(){const q=$('bsr')?$('bsr').value:'';$('bn').innerHTML='<input id="bsr" placeholder="🔍 Ҷустуҷӯи мизоҷ" value="'+esc(q)+'" oninput="rBonL()" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px;font-size:16px"><div id="bl"></div>';rBonL()}
function rBonL(){const q=($('bsr').value||'').toLowerCase(),L=clients().filter(c=>(vipOf(c.name)||bonBal(c.k)>0)&&(c.name.toLowerCase().includes(q)||c.phone.includes(q))).map(c=>({c,b:bonBal(c.k)})).sort((a,b)=>b.b-a.b);
 $('bl').innerHTML=L.length?L.map(o=>li((vipOf(o.c.name)?'⭐ ':'')+esc(o.c.name),esc(o.c.phone)+' · бонус: <b class="pos">'+bf(o.b)+' TJS</b>',ib('ok','🎁',"bonusAsk('"+ek(o.c.k)+"')"))).join(''):'<div class="em">Мизоҷи бонусдор нест</div>'}
function bonusAsk(e){const k=decodeURIComponent(e),c=clients().find(x=>x.k===k);if(!c)return;const b=Math.round(bonBal(k)*100)/100;
 if(!(b>0)){toast('Бонуси ҳозира 0 аст','err');return}
 showM('<h3>🎁 Бонус додан</h3><div class="cd"><div class="r"><i>Мизоҷ</i><b>'+esc(c.name)+'</b></div><div class="r"><i>Бонуси ҳозира</i><b class="pos">'+bf(b)+' TJS</b></div></div><p style="font-size:13px;color:#777">Пас аз тасдиқ тавозун 0 мешавад ва дар таърих сана ва маблағ сабт мешавад.</p><button class="b" onclick="bonusPay(\''+e+'\')">✅ Бонус дода шуд — 0 кардан</button><button class="b g" onclick="closeM()">Бекор кардан</button>')}
function bonusPay(e){const k=decodeURIComponent(e),c=clients().find(x=>x.k===k);if(!c)return;const b=Math.round(bonBal(k)*100)/100;if(!(b>0)){closeM();return}
 DB.bonus.push({id:uid(),k,name:c.name,d:new Date().toISOString(),a:b});closeM();save();renderAll();toast('🎁 Бонус дода шуд: '+bf(b)+' TJS');if(ROLE!=='seller')acct(e)}

function openSet(){showM('<h3>⚙️ Танзимот</h3><div class="cd"><div class="r"><i>Фуруш (сабтҳо)</i><b>'+DB.sales.length+'</b></div><div class="r"><i>Мол</i><b>'+DB.inventory.length+'</b></div><div class="r"><i>Ҳолати захира</i><b id="ind" style="font-size:12px"></b></div></div><button class="b g" onclick="csvSales()">📊 Excel: фурӯш (CSV)</button><button class="b g" onclick="csvInv()">📊 Excel: анбор (CSV)</button><button class="b g" onclick="backup()">💾 Резервӣ JSON</button><label style="margin-top:12px">📂 Баргардонидан аз JSON</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p style="font-size:12px;color:#999;margin-top:10px">Ҳар ҳафта як бор «Резервӣ JSON» гиред ва ба Telegram фиристед.</p><button class="b g" onclick="closeM()">Пӯшидан</button>');ind()}
function backup(){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kulba-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()}
function restore(ev){const f=ev.target.files[0];if(!f)return;if(f.size>20e6){toast('Файл аз ҳад калон аст','err');return}const r=new FileReader();
 r.onload=()=>{try{const d=clean(JSON.parse(r.result));if(!cnt(d)){toast('Файл холӣ ё нодуруст аст','err');return}
  if(!confirm('Маълумоти ҳозира бо '+cnt(d)+' сабт иваз мешавад. Идома диҳем?'))return;
  idbPut('before-restore',JSON.stringify(DB));Object.keys(DB).forEach(k=>DB[k]=Array.isArray(d[k])?d[k]:[]);last=0;closeM();save();renderAll();toast('✅ Барқарор шуд')}catch(e){toast('Файл хонда нашуд','err')}};r.readAsText(f)}
