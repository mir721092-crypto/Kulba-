<!DOCTYPE html>
<html lang="tg"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>КУЛБА — ҳисоби шумо</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#1a1a1a;padding-bottom:30px}
.h{background:#101a14;color:#fff;padding:22px 18px;display:flex;gap:12px;align-items:center}
.h .l{width:46px;height:46px;border-radius:12px;background:#1f3a2a;display:flex;align-items:center;justify-content:center;font-size:24px}
.h h1{font-size:22px}.h p{opacity:.8;font-size:13px}
.c{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:14px;margin:12px;max-width:640px}
@media(min-width:680px){.c{margin:12px auto}}
.c h4{font-size:15px;margin-bottom:8px}.c p{font-size:13px;color:#666;margin-bottom:10px}
.f{display:flex;gap:8px}
input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{padding:13px 18px;border:0;border-radius:10px;background:#101a14;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button.g{background:#eee;color:#222;width:100%;margin-top:6px}
.r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f3f3f3;font-size:14px}.r:last-child{border:0}
.r i{font-style:normal;color:#888}.g2{color:#4caf50}.b{color:#ef5350}
.big{text-align:center;padding:10px 0}.big b{font-size:30px;color:#4caf50;display:block}.big span{font-size:12px;color:#888}
.e{text-align:center;padding:24px 14px;color:#999;font-size:14px}.er{color:#ef5350;font-size:13px;margin-top:8px}
.ft{text-align:center;font-size:12px;color:#aaa;margin-top:14px}
</style></head><body>
<div class="h"><div class="l">🪵</div><div><h1>Кулба</h1><p>Ҳисоби харидҳои шумо</p></div></div>
<div id="fm" class="c"><h4>Рақами телефонро ворид кунед</h4><p>Бо рақаме, ки ҳангоми харид ба мағоза додаед.</p>
<div class="f"><input id="ph" type="tel" inputmode="tel" placeholder="Масалан: 92 123 45 67" autocomplete="tel"><button onclick="look()">Дидан</button></div><div id="er" class="er"></div></div>
<div id="o"></div>
<div class="ft">Мағозаи «Кулба» · Истравшан</div>
<script>
var API='AIzaSyB5oBJ4E2Hpf0YsFjNoytTRXCiM1-82Nng',PID='kulba2';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){n=Math.round((+n||0)*100)/100;return(Number.isInteger(n)?String(Math.abs(n)):Math.abs(n).toFixed(2)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function dt(d){d=new Date(d);if(isNaN(d))return'';function p(n){return String(n).padStart(2,'0')}return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()}
var o=document.getElementById('o'),fm=document.getElementById('fm'),er=document.getElementById('er');
function show(P){
 fm.style.display='none';
 var h='<div class="c"><h4>'+(P.vip?'⭐ ':'')+esc(P.name)+'</h4>';
 if(P.vip)h+='<div class="big"><b>'+fmt(P.bonus)+' TJS</b><span>🎁 Бонуси шумо'+(P.rate?' ('+esc(P.rate)+'%)':'')+'</span></div>';
 h+='<div class="r"><i>Ҷамъи харид</i><b>'+fmt(P.spent)+' TJS</b></div><div class="r"><i>Шумораи харид</i><b>'+esc(P.orders)+'</b></div>';
 if(P.debt>0)h+='<div class="r"><i>Қарз</i><b class="b">'+fmt(P.debt)+' TJS</b></div>'+(P.dd?'<div class="r"><i>Аз санаи</i><b>'+dt(P.dd)+'</b></div>':'');
 h+='</div>';
 if(P.debt>0&&P.dh&&P.dh.length)h+='<div class="c"><h4>💳 Таърихи қарз</h4>'+P.dh.map(function(x){return'<div class="r"><span>'+dt(x.d)+'</span><b class="'+(x.t==='-'?'g2':x.t==='+'?'b':'')+'">'+(x.t==='-'?'− ':x.t==='+'?'+ ':'↩ ')+fmt(x.a)+'</b></div>'}).join('')+'</div>';
 h+='<div class="c"><h4>🧾 Харидҳои охир</h4>'+((P.items||[]).map(function(x){return'<div class="r"><span>'+esc(x.n)+' × '+esc(x.q)+' '+esc(x.u)+'<br><i>'+dt(x.d)+'</i></span><b>'+fmt(x.s)+'</b></div>'}).join('')||'<div class="e">Харид нест</div>')+'</div>';
 h+='<div class="c" style="background:none;border:0;padding:0"><button class="g" onclick="back()">⬅️ Рақами дигар</button></div><div class="ft">Нав шуд: '+dt(P.t)+'</div>';
 o.innerHTML=h}
function back(){o.innerHTML='';fm.style.display='';er.textContent='';document.getElementById('ph').focus()}
function look(){
 var raw=document.getElementById('ph').value,d=raw.replace(/\D/g,'');
 if(d.length<9){er.textContent='Рақамро пурра нависед (9 рақам)';return}
 var id=d.slice(-9);er.textContent='Интизор шавед...';
 try{localStorage.setItem('kph',raw)}catch(e){}
 fetch('https://firestore.googleapis.com/v1/projects/'+PID+'/databases/(default)/documents/portal/'+id+'?key='+API)
 .then(function(r){if(r.status===404||r.status===403){er.textContent='Бо ин рақам ҳисоб ёфт нашуд. Аз мағоза пурсед.';return null}if(!r.ok)throw 0;return r.json()})
 .then(function(j){if(!j)return;var P=JSON.parse(j.fields.d.stringValue);er.textContent='';show(P)})
 .catch(function(){er.textContent='Хато шуд. Интернетро санҷед ва боз кӯшиш кунед.'})}
document.getElementById('ph').addEventListener('keydown',function(e){if(e.key==='Enter')look()});
(function(){var P=null;try{var h=location.hash.slice(1);if(h)P=JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){}
 if(P&&typeof P==='object'&&P.name){show(P);return}
 try{var s=localStorage.getItem('kph');if(s)document.getElementById('ph').value=s}catch(e){}})();
</script></body></html>
